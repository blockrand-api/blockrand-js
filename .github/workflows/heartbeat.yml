name: API Heartbeat Watchdog
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:      # Allows manual trigger for testing

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Commit and Reveal Randomness
        env:
          API_KEY: ${{ secrets.WATCHDOG_API_KEY }}
          API_URL: "https://api.blockrand.net/api/v1" 
        run: |
          echo "--- Starting Heartbeat ---"
          
          # 1. COMMIT
          # Uses player_id 'watchdog' 
          # player_hash is SHA256 for "watchdog_secret"
          COMMIT_RES=$(curl -s -X POST "$API_URL/commit" \
            -H "X-API-KEY: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "player_id": "watchdog", 
              "player_hash": "49f997970929235942484f90117b36f45a6c17822606540c4987f28243444093", 
              "delay_sec": 10
            }')
          
          echo "Commit Response: $COMMIT_RES"
          TARGET_ROUND=$(echo $COMMIT_RES | jq -r '.target_round')

          if [ "$TARGET_ROUND" == "null" ] || [ -z "$TARGET_ROUND" ]; then
            echo "Error: Failed to get target_round from API. Check API Key or URL."
            exit 1
          fi

          # 2. WAIT 
          # 15s to cover the 10s delay + Drand publishing + Cloud Task latency
          echo "Waiting 15s for Round $TARGET_ROUND..."
          sleep 15

          # 3. REVEAL
          # The secret "watchdog_secret" matches the hash in step 1
          REVEAL_RES=$(curl -s -X POST "$API_URL/reveal" \
            -H "X-API-KEY: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"player_id\": \"watchdog\", 
              \"player_secret\": \"watchdog_secret\", 
              \"target_round\": $TARGET_ROUND
            }")

          echo "Reveal Response: $REVEAL_RES"
          
          # 4. VALIDATION
          # We accept 'ready' or 'revealed' as a successful heartbeat
          STATUS=$(echo $REVEAL_RES | jq -r '.status')
          if [ "$STATUS" != "revealed" ] && [ "$STATUS" != "ready" ]; then
            echo "Heartbeat Failed: Expected success status but got '$STATUS'"
            exit 1
          fi
          
          echo "--- Heartbeat Successful! ---"
